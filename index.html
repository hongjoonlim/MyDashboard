<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>나의 오늘 대시보드</title>
  <style>
    :root { color-scheme: dark; --bg:#0b1020; --surface:#141b31; --surface2:#1a2440; --line:rgba(255,255,255,.1); --text:#f7f8fc; --muted:#9ca8c2; --accent:#7c9cff; --mint:#4de1c1; --sun:#ffd166; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; font-family:ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; background:radial-gradient(circle at 85% 0,#253765 0,transparent 30rem),var(--bg); color:var(--text); }
    main { width:min(1120px,calc(100% - 32px)); margin:0 auto; padding:42px 0 56px; }
    header { display:flex; align-items:end; justify-content:space-between; gap:20px; margin-bottom:30px; }
    h1 { margin:0; font-size:clamp(28px,4vw,42px); letter-spacing:-.055em; }
    .today { color:var(--muted); margin:7px 0 0; }
    button { font:inherit; color:inherit; cursor:pointer; }
    .icon-btn { padding:10px 14px; border:1px solid var(--line); border-radius:10px; background:rgba(255,255,255,.05); }
    .icon-btn:hover { border-color:var(--accent); }
    .grid { display:grid; gap:16px; }
    .top { grid-template-columns:1.25fr .75fr; }
    .bottom { grid-template-columns:1fr 1fr; margin-top:16px; }
    .card { border:1px solid var(--line); border-radius:18px; padding:24px; background:linear-gradient(145deg,rgba(255,255,255,.08),rgba(255,255,255,.025)); box-shadow:0 16px 40px rgba(0,0,0,.18); }
    .eyebrow { margin:0 0 12px; color:var(--muted); font-size:13px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; }
    .weather-main { display:flex; justify-content:space-between; align-items:center; gap:20px; }
    .place { margin:0 0 5px; font-weight:700; font-size:18px; }
    .temp { margin:0; font-size:64px; font-weight:750; letter-spacing:-.07em; line-height:.95; }
    .condition { margin:10px 0 0; color:var(--muted); }
    .weather-icon { font-size:64px; line-height:1; }
    .weather-stats { display:flex; flex-wrap:wrap; gap:12px 26px; margin-top:25px; padding-top:18px; border-top:1px solid var(--line); color:var(--muted); font-size:14px; }
    .weather-stats b { color:var(--text); margin-left:6px; }
    .clock-list { display:grid; gap:16px; }
    .clock { display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .city { display:block; font-weight:700; } .zone { display:block; margin-top:3px; color:var(--muted); font-size:12px; }
    .time { font-variant-numeric:tabular-nums; font-weight:700; font-size:20px; letter-spacing:-.03em; }
    .rates { display:grid; gap:0; }
    .rate { display:grid; grid-template-columns:1fr auto; align-items:center; padding:17px 0; border-bottom:1px solid var(--line); }
    .rate:last-child { border:0; padding-bottom:0; }.pair { font-size:15px; font-weight:750; }.rate small { display:block; margin-top:4px; color:var(--muted); }.value { color:var(--mint); font-size:24px; font-weight:750; font-variant-numeric:tabular-nums; letter-spacing:-.04em; }
    .updated { margin:18px 0 0; color:var(--muted); font-size:12px; }
    .forecast { display:flex; justify-content:space-between; gap:8px; margin-top:18px; }.day { width:20%; text-align:center; color:var(--muted); font-size:13px; }.day b { display:block; margin:7px 0; font-size:24px; color:var(--text); }.day span { color:var(--sun); font-size:18px; }
    dialog { width:min(420px,calc(100% - 32px)); border:1px solid var(--line); border-radius:16px; padding:24px; color:var(--text); background:var(--surface2); box-shadow:0 30px 100px rgba(0,0,0,.55); } dialog::backdrop { background:rgba(0,0,0,.55); } dialog h2 { margin:0 0 16px; font-size:21px; } label { display:block; color:var(--muted); font-size:14px; } input { width:100%; margin-top:8px; padding:12px; border:1px solid var(--line); border-radius:9px; background:#0c1223; color:var(--text); font:inherit; } .actions { display:flex; justify-content:flex-end; gap:9px; margin-top:20px; }.primary { border:0; border-radius:9px; padding:10px 14px; background:var(--accent); color:#101a35; font-weight:750; }.secondary { border:0; padding:10px 12px; background:transparent; color:var(--muted); }
    @media (max-width:720px) { main { padding-top:26px; } header { align-items:start; flex-direction:column; }.top,.bottom { grid-template-columns:1fr; }.temp{font-size:55px}.card{padding:20px} }
  </style>
</head>
<body>
  <main>
    <header><div><h1>오늘의 대시보드</h1><p class="today" id="today">불러오는 중…</p></div><button class="icon-btn" id="change-place" type="button">위치 변경</button></header>
    <section class="grid top">
      <article class="card"><p class="eyebrow">오늘의 날씨</p><div class="weather-main"><div><p class="place" id="place">—</p><p class="temp" id="temp">—°</p><p class="condition" id="condition">날씨 정보를 불러오는 중</p></div><div class="weather-icon" id="weather-icon" aria-hidden="true">☀️</div></div><div class="weather-stats"><span>체감 <b id="apparent">—</b></span><span>강수 확률 <b id="rain">—</b></span><span>풍속 <b id="wind">—</b></span></div></article>
      <article class="card"><p class="eyebrow">세계 시간</p><div class="clock-list"><div class="clock"><div><span class="city">비엔나</span><span class="zone">Europe/Vienna</span></div><time class="time" data-zone="Europe/Vienna">—</time></div><div class="clock"><div><span class="city">서울</span><span class="zone">Asia/Seoul</span></div><time class="time" data-zone="Asia/Seoul">—</time></div><div class="clock"><div><span class="city">뱅갈루루</span><span class="zone">Asia/Kolkata · IST</span></div><time class="time" data-zone="Asia/Kolkata">—</time></div><div class="clock"><div><span class="city">뉴욕</span><span class="zone">America/New_York</span></div><time class="time" data-zone="America/New_York">—</time></div></div></article>
    </section>
    <section class="grid bottom">
      <article class="card"><p class="eyebrow">환율</p><div class="rates"><div class="rate"><div class="pair">미국 달러 <small>1 USD = KRW</small></div><div class="value" id="usd-rate">—</div></div><div class="rate"><div class="pair">유로 <small>1 EUR = KRW</small></div><div class="value" id="eur-rate">—</div></div></div><p class="updated" id="rate-updated">유럽중앙은행 기준환율을 불러오는 중…</p></article>
      <article class="card"><p class="eyebrow">5일 예보</p><div class="forecast" id="forecast"><span class="day">불러오는 중</span></div></article>
    </section>
  </main>
  <dialog id="place-dialog"><form method="dialog"><h2>날씨 위치</h2><label>도시 이름<input id="place-input" value="Vienna" autocomplete="off" placeholder="예: Seoul, Vienna, Busan"></label><div class="actions"><button class="secondary" value="cancel">취소</button><button class="primary" id="save-place" value="default">저장</button></div></form></dialog>
  <script>
    const codes={0:['맑음','☀️'],1:['대체로 맑음','🌤️'],2:['구름 조금','⛅'],3:['흐림','☁️'],45:['안개','🌫️'],48:['서리 안개','🌫️'],51:['이슬비','🌦️'],53:['이슬비','🌦️'],55:['강한 이슬비','🌧️'],61:['비','🌧️'],63:['비','🌧️'],65:['강한 비','🌧️'],71:['눈','🌨️'],73:['눈','🌨️'],75:['강한 눈','❄️'],80:['소나기','🌦️'],81:['소나기','🌧️'],82:['강한 소나기','⛈️'],95:['뇌우','⛈️'],96:['우박 뇌우','⛈️'],99:['우박 뇌우','⛈️']};
    const $=s=>document.querySelector(s), fmt=n=>new Intl.NumberFormat('ko-KR',{maximumFractionDigits:2}).format(n);
    function clock(){const now=new Date(); $('#today').textContent=new Intl.DateTimeFormat('ko-KR',{weekday:'long',year:'numeric',month:'long',day:'numeric'}).format(now); document.querySelectorAll('[data-zone]').forEach(e=>e.textContent=new Intl.DateTimeFormat('ko-KR',{timeZone:e.dataset.zone,hour:'2-digit',minute:'2-digit',hour12:false}).format(now));} clock(); setInterval(clock,1000);
    async function loadWeather(place){
      try { const g=await fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(place)+'&count=1&language=ko&format=json').then(r=>r.json()); if(!g.results?.[0]) throw Error(); const p=g.results[0], u='https://api.open-meteo.com/v1/forecast?latitude='+p.latitude+'&longitude='+p.longitude+'&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,precipitation_probability_max&timezone=auto&forecast_days=5'; const d=await fetch(u).then(r=>r.json()); const c=d.current, w=codes[c.weather_code]||['날씨 정보 없음','🌡️']; $('#place').textContent=p.name+(p.country?' · '+p.country:''); $('#temp').textContent=Math.round(c.temperature_2m)+'°'; $('#condition').textContent=w[0]; $('#weather-icon').textContent=w[1]; $('#apparent').textContent=Math.round(c.apparent_temperature)+'°'; $('#rain').textContent=d.daily.precipitation_probability_max[0]+'%'; $('#wind').textContent=Math.round(c.wind_speed_10m)+' km/h'; $('#forecast').innerHTML=d.daily.time.map((date,i)=>{const z=codes[d.daily.weather_code[i]]||['','🌡️']; return '<div class="day">'+new Intl.DateTimeFormat('ko-KR',{weekday:'short',timeZone:d.timezone}).format(new Date(date+'T12:00:00'))+'<span>'+z[1]+'</span><b>'+Math.round(d.daily.temperature_2m_max[i])+'°</b></div>'}).join(''); localStorage.dashboardPlace=place;
      } catch { $('#condition').textContent='날씨 정보를 불러올 수 없습니다'; }
    }
    async function loadRates(){try { const d=await fetch('https://api.frankfurter.dev/v1/latest?base=EUR&symbols=USD,KRW').then(r=>r.json()), eur=d.rates.KRW, usd=eur/d.rates.USD; $('#usd-rate').textContent='₩'+fmt(usd); $('#eur-rate').textContent='₩'+fmt(eur); $('#rate-updated').textContent='기준일 '+d.date+' · ECB 기준환율'; }catch{$('#rate-updated').textContent='환율 정보를 불러올 수 없습니다';}}
    const dialog=$('#place-dialog'); $('#change-place').onclick=()=>dialog.showModal(); $('#save-place').onclick=e=>{e.preventDefault(); const value=$('#place-input').value.trim(); if(value){loadWeather(value); dialog.close();}}; loadWeather(localStorage.dashboardPlace||'Vienna'); loadRates();
  </script>
</body>
</html>
